spring.application.name=bookhive

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookhive}
spring.datasource.username=${DB_USERNAME:bookhive}
spring.datasource.password=${DB_PASSWORD:}

spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=none

bookhive.session.provisional.enabled=${SESSION_PROVISIONAL:false}
bookhive.session.provisional.institution=${SESSION_INSTITUTION:}
bookhive.session.provisional.librarian=${SESSION_LIBRARIAN:}

bookhive.identity.project-id=${IDENTITY_PROJECT_ID:}
bookhive.session.minutes=${SESSION_MINUTES:20}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${TRACING_EXPORT:false}
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

server.forward-headers-strategy=framework
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.enabled=false

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{institucion:-}]

logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC
