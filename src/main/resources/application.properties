spring.application.name=bookhive

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookhive}
spring.datasource.username=${DB_USERNAME:bookhive}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:3000}

spring.threads.virtual.enabled=true

spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=none

bookhive.session.provisional.enabled=${SESSION_PROVISIONAL:false}
bookhive.session.provisional.identity=${SESSION_IDENTITY:}

bookhive.identity.project-id=${IDENTITY_PROJECT_ID:}
bookhive.session.minutes=${SESSION_MINUTES:20}

bookhive.search.url=${TYPESENSE_URL:}
bookhive.search.api-key=${TYPESENSE_API_KEY:}
bookhive.search.sync-on-startup=${SEARCH_SYNC_ON_STARTUP:true}

bookhive.messaging.project=${PUBSUB_PROJECT:}
bookhive.messaging.pubsub-url=${PUBSUB_URL:https://pubsub.googleapis.com}
bookhive.messaging.token-url=${METADATA_TOKEN_URL:http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token}
bookhive.messaging.tasks-topic=${TASKS_TOPIC:bookhive-tareas}
bookhive.messaging.notices-topic=${NOTICES_TOPIC:bookhive-avisos}

bookhive.tasks.audience=${TASKS_AUDIENCE:}
bookhive.tasks.callers=${TASKS_CALLERS:}
bookhive.tasks.trust-cloud-run-iam=${TASKS_TRUST_CLOUD_RUN_IAM:false}
bookhive.reminders.days-before=${REMINDER_DAYS_BEFORE:2}
bookhive.reservations.pickup-days=${RESERVATION_PICKUP_DAYS:2}

bookhive.email.url=${BREVO_URL:https://api.brevo.com/v3/smtp/email}
bookhive.email.api-key=${BREVO_API_KEY:}
bookhive.email.sender-email=${EMAIL_SENDER:}
bookhive.email.sender-name=${EMAIL_SENDER_NAME:BookHive}

bookhive.payments.wompi.api-url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
bookhive.payments.wompi.checkout-url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
bookhive.payments.wompi.public-key=${WOMPI_PUBLIC_KEY:}
bookhive.payments.wompi.private-key=${WOMPI_PRIVATE_KEY:}
bookhive.payments.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
bookhive.payments.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
bookhive.payments.redirect-url=${PAYMENT_REDIRECT_URL:}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${TRACING_EXPORT:false}
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

server.forward-headers-strategy=framework
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.enabled=false

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{institucion:-}]

logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC
