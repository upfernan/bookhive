spring.application.name=bookhive

# Base de datos PostgreSQL. La contraseña real nunca se escribe aquí:
# llega como variable de entorno desde el baúl de secretos (ADR-043).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookhive}
spring.datasource.username=${DB_USERNAME:bookhive}
spring.datasource.password=${DB_PASSWORD:}

# Las tablas las crean las migraciones (ADR-015), no Hibernate.
spring.jpa.hibernate.ddl-auto=none

# Flyway NO corre al arrancar. Si corriera, cada copia que levante Cloud Run
# intentaria migrar al tiempo, y ademas hay que recorrer un esquema por
# institucion, cosa que el arranque automatico no sabe hacer. Las migraciones
# van como paso aparte del despliegue.
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# Permite arrancar la aplicación aunque la base de datos todavía no exista.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- Instrumentacion y trazabilidad (ADR-056) ---

# Todas las peticiones se trazan. En produccion esto se baja para no pagar
# almacenamiento de trazas que nadie va a leer.
management.tracing.sampling.probability=1.0

# Que expone actuator. Solo lo necesario: nada de /actuator/env ni /beans,
# que filtran configuracion.
management.endpoints.web.exposure.include=health,info,metrics

# Cada linea del registro lleva el identificador de traza y de tramo, mas la
# institucion que atiende la peticion. Los tres salen del MDC: micrometer pone
# traceId y spanId, y el filtro de BookHive pone institucion.
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{institucion:-}]

# Las marcas de tiempo del registro tambien en UTC-0.
logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC

# Perfil por defecto: "memoria". Usa los adaptadores temporales en memoria, para
# que la aplicación y las pruebas funcionen sin base de datos. Para usar
# PostgreSQL (adaptadores JPA) se arranca con otro perfil, por ejemplo:
# SPRING_PROFILES_ACTIVE=postgres
spring.profiles.default=memoria

# TEMPORAL: mientras no hay base de datos ni inicio de sesión.
# Los usan los adaptadores en memoria y el usuario en sesión temporal.
bookhive.temporal.bibliotecario=cccccccc-cccc-cccc-cccc-cccccccccccc
bookhive.temporal.institucion=dddddddd-dddd-dddd-dddd-dddddddddddd
bookhive.temporal.zona-horaria=America/Bogota
bookhive.temporal.dias-prestamo=15
bookhive.temporal.maximo-prestamos=3
