name: Imagen
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  imagen:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Entrar al registro de GitHub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/upfernan/bookhive:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  desplegar:
    name: Desplegar en Cloud Run
    if: github.event_name == 'push'
    needs: imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Entrar a Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/164070755294/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@bookhive-511618.iam.gserviceaccount.com
      - name: Desplegar la imagen
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d
        with:
          service: bookhive-api
          region: us-east1
          image: ghcr.io/upfernan/bookhive:${{ github.sha }}